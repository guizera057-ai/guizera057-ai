name: Jogo de Damas
on:
  issues:
    types: [opened]

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Rodar o Cérebro do Jogo
        run: python motor_damas.py "${{ github.event.issue.title }}"
